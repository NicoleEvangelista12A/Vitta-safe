<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="tema.css">
    <script type="module" src="./index.js"></script>
    <title>Cadastro - Inovax Techmind</title>
</head>
<body class="cadastro-container">
    <header class="navbar">
        <div class="logo">Inovax Techmind</div>
        <nav class="nav-links">
            <a href="index.html" class="btn-cadastrar">voltar</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="form-card">
            <div class="form-header">
                <span class="subtitle">|| Cadastro de Usuário</span>
                <h1>CRIE SUA CONTA</h1>
            </div>
            <form>
                <input type="text" placeholder="Nome Completo" required>
                <input type="email" placeholder="E-mail" required>
                <input type="password" placeholder="Senha" required>
                <input type="password" placeholder="Confirmar Senha" required>
                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Aceito os <a href="#">termos de uso</a> e <a href="#">política de privacidade</a></label>
                </div>
                <button type="submit" class="submit-btn">CONFIRMAR CADASTRO</button>
            </form>
            <p class="login-link">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </p>
        </div>
        <div class="menu-direito">
            <button id="botao-tema">☀️</button>
        </div>
    </main>
</body>
</html>
