<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inovax Techmind</title>
    <!-- Link para o mesmo arquivo CSS -->
    <link rel="stylesheet" href="login.css">
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="cadastro-container">

    <header class="navbar">
        <div class="logo">Inovax Techmind</div>
        <nav class="nav-links">
            <a href="#">Community</a>
            <a href="#">About</a>
            <a href="#">Support</a>
            <a href="#">Contact</a>
            <!-- Botão que volta para a página inicial -->
            <a href="index.html" class="btn-cadastrar">voltar</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="form-card">
            <div class="form-header">
                <span class="subtitle">|| Acesso ao Sistema</span>
                <h1>FAÇA SEU LOGIN</h1>
            </div>

            <form>
                <input type="email" placeholder="E-mail" required>
                <input type="password" placeholder="Senha" required>

                <button type="submit" class="submit-btn" style="margin-top: 15px;">ENTRAR</button>
            </form>

            <p class="login-link">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </div>
    </main>

</body>
</html>
